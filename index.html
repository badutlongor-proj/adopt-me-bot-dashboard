<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adopt Me Bot Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        Inter,
        Arial,
        sans-serif;

    background:
        #0b0f19;

    color:
        #f5f7fb;
}

button {
    font-family: inherit;
}

.app {
    min-height: 100vh;
}


/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {

    position: fixed;

    left: 0;
    top: 0;
    bottom: 0;

    width: 230px;

    background:
        #111827;

    border-right:
        1px solid #1f2937;

    padding: 24px 16px;
}

.logo {

    font-size: 21px;
    font-weight: 800;

    margin-bottom: 35px;
}

.logo span {
    color: #8b5cf6;
}

.menu {

    display: flex;
    flex-direction: column;
    gap: 8px;
}

.menu button {

    border: 0;

    background: transparent;

    color: #9ca3af;

    text-align: left;

    padding: 12px 14px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 14px;
}

.menu button.active,
.menu button:hover {

    background:
        #1f2937;

    color:
        #ffffff;
}


/* =========================================================
   MAIN
   ========================================================= */

.main {

    margin-left: 230px;

    padding: 25px;
}

.topbar {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-bottom: 25px;
}

.title {

    font-size: 26px;

    font-weight: 800;
}

.subtitle {

    margin-top: 5px;

    color:
        #9ca3af;

    font-size: 13px;
}


/* =========================================================
   BUTTON
   ========================================================= */

.refresh-btn {

    border: 0;

    background:
        #7c3aed;

    color:
        white;

    padding:
        11px 17px;

    border-radius:
        9px;

    cursor:
        pointer;

    font-weight:
        700;
}

.refresh-btn:hover {

    background:
        #6d28d9;
}

.refresh-btn:disabled {

    opacity:
        .6;

    cursor:
        not-allowed;
}


/* =========================================================
   STATS
   ========================================================= */

.stats {

    display:
        grid;

    grid-template-columns:
        repeat(5, minmax(0, 1fr));

    gap:
        15px;

    margin-bottom:
        25px;
}

.stat {

    background:
        #111827;

    border:
        1px solid #1f2937;

    border-radius:
        13px;

    padding:
        18px;
}

.stat-label {

    color:
        #9ca3af;

    font-size:
        12px;

    margin-bottom:
        8px;
}

.stat-value {

    font-size:
        24px;

    font-weight:
        800;
}


/* =========================================================
   CARD
   ========================================================= */

.card {

    background:
        #111827;

    border:
        1px solid #1f2937;

    border-radius:
        14px;

    overflow:
        hidden;
}


/* =========================================================
   TABLE
   ========================================================= */

.table-wrap {

    width:
        100%;

    overflow-x:
        auto;
}

table {

    width:
        100%;

    border-collapse:
        collapse;

    min-width:
        950px;
}

th {

    text-align:
        left;

    padding:
        14px 16px;

    color:
        #9ca3af;

    font-size:
        12px;

    font-weight:
        700;

    border-bottom:
        1px solid #1f2937;
}

td {

    padding:
        15px 16px;

    border-bottom:
        1px solid #1f2937;

    font-size:
        13px;
}

tr:last-child td {
    border-bottom: 0;
}


/* =========================================================
   STATUS
   ========================================================= */

.status {

    display:
        inline-flex;

    align-items:
        center;

    gap:
        6px;

    padding:
        5px 9px;

    border-radius:
        999px;

    font-size:
        11px;

    font-weight:
        700;
}

.status.online {

    background:
        rgba(34,197,94,.12);

    color:
        #4ade80;
}

.status.offline {

    background:
        rgba(239,68,68,.12);

    color:
        #f87171;
}


/* =========================================================
   ACTIONS
   ========================================================= */

.actions {

    display:
        flex;

    gap:
        7px;
}

.action-btn {

    width:
        34px;

    height:
        34px;

    border:
        1px solid #374151;

    background:
        #182131;

    color:
        white;

    border-radius:
        8px;

    cursor:
        pointer;

    font-size:
        15px;
}

.action-btn:hover {

    background:
        #253044;
}


/* =========================================================
   EMPTY
   ========================================================= */

.empty {

    padding:
        50px 20px;

    text-align:
        center;

    color:
        #6b7280;
}


/* =========================================================
   MODAL
   ========================================================= */

.modal {

    position:
        fixed;

    inset:
        0;

    background:
        rgba(0,0,0,.72);

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        20px;

    z-index:
        1000;
}

.modal.show {
    display:
        flex;
}

.modal-box {

    width:
        min(900px, 100%);

    max-height:
        90vh;

    overflow:
        auto;

    background:
        #111827;

    border:
        1px solid #374151;

    border-radius:
        16px;

    padding:
        22px;
}

.modal-header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-bottom:
        20px;
}

.modal-title {

    font-size:
        20px;

    font-weight:
        800;
}

.close-btn {

    border:
        0;

    background:
        transparent;

    color:
        #9ca3af;

    font-size:
        24px;

    cursor:
        pointer;
}


/* =========================================================
   INVENTORY
   ========================================================= */

.inventory-summary {

    display:
        grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap:
        12px;

    margin-bottom:
        20px;
}

.inventory-stat {

    background:
        #182131;

    border:
        1px solid #263244;

    padding:
        14px;

    border-radius:
        10px;
}

.inventory-stat-label {

    color:
        #9ca3af;

    font-size:
        11px;
}

.inventory-stat-value {

    margin-top:
        5px;

    font-size:
        18px;

    font-weight:
        800;
}

.inventory-group {

    margin-bottom:
        20px;
}

.inventory-group-title {

    font-weight:
        800;

    margin-bottom:
        10px;

    font-size:
        15px;
}

.inventory-grid {

    display:
        grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(150px, 1fr)
        );

    gap:
        9px;
}

.inventory-item {

    background:
        #182131;

    border:
        1px solid #263244;

    border-radius:
        9px;

    padding:
        11px;
}

.inventory-item-name {

    font-size:
        13px;

    font-weight:
        700;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;
}

.inventory-item-count {

    color:
        #9ca3af;

    font-size:
        12px;

    margin-top:
        4px;
}

.inventory-updated {

    color:
        #9ca3af;

    font-size:
        12px;

    margin-top:
        15px;
}


/* =========================================================
   TOAST
   ========================================================= */

.toast {

    position:
        fixed;

    right:
        20px;

    bottom:
        20px;

    background:
        #1f2937;

    border:
        1px solid #374151;

    color:
        white;

    padding:
        13px 16px;

    border-radius:
        10px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.3);

    transform:
        translateY(20px);

    opacity:
        0;

    pointer-events:
        none;

    transition:
        .2s;

    z-index:
        2000;

    font-size:
        13px;
}

.toast.show {

    transform:
        translateY(0);

    opacity:
        1;
}


/* =========================================================
   LOADING
   ========================================================= */

.loading {

    padding:
        40px;

    text-align:
        center;

    color:
        #9ca3af;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 1100px) {

    .stats {

        grid-template-columns:
            repeat(3, 1fr);

    }

}

@media (max-width: 800px) {

    .sidebar {

        position:
            static;

        width:
            100%;

        height:
            auto;

        border-right:
            0;

        border-bottom:
            1px solid #1f2937;

    }

    .main {

        margin-left:
            0;

    }

    .stats {

        grid-template-columns:
            repeat(2, 1fr);

    }

}

@media (max-width: 500px) {

    .main {

        padding:
            15px;

    }

    .stats {

        grid-template-columns:
            1fr;

    }

    .topbar {

        align-items:
            flex-start;

        gap:
            15px;

        flex-direction:
            column;

    }

    .inventory-summary {

        grid-template-columns:
            1fr;

    }

}

</style>
</head>


<body>


<div class="app">


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">

        <div class="logo">
            Adopt Me <span>Monitor</span>
        </div>

        <div class="menu">

            <button
                class="active"
                type="button">
                Dashboard
            </button>

        </div>

    </aside>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="main">


        <!-- =================================================
             TOPBAR
             ================================================= -->

        <div class="topbar">

            <div>

                <div class="title">
                    Bot Dashboard
                </div>

                <div class="subtitle">
                    Monitor status dan inventory bot
                </div>

            </div>


            <button
                id="refreshBtn"
                class="refresh-btn"
                type="button"
                onclick="refreshAll()">

                🔄 Refresh

            </button>

        </div>


        <!-- =================================================
             STATS
             ================================================= -->

        <div class="stats">


            <div class="stat">

                <div class="stat-label">
                    Total Bot
                </div>

                <div
                    id="statTotal"
                    class="stat-value">

                    0

                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Online
                </div>

                <div
                    id="statOnline"
                    class="stat-value">

                    0

                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Offline
                </div>

                <div
                    id="statOffline"
                    class="stat-value">

                    0

                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Crystal Egg
                </div>

                <div
                    id="statCrystal"
                    class="stat-value">

                    0

                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Total Inventory
                </div>

                <div
                    id="statInventory"
                    class="stat-value">

                    0

                </div>

            </div>


        </div>


        <!-- =================================================
             TABLE
             ================================================= -->

        <div class="card">

            <div
                id="tableContainer"
                class="table-wrap">

                <div class="loading">
                    Memuat dashboard...
                </div>

            </div>

        </div>


    </main>

</div>


<!-- =========================================================
     INVENTORY MODAL
     ========================================================= -->

<div
    id="inventoryModal"
    class="modal"
    onclick="closeInventoryOutside(event)">

    <div class="modal-box">

        <div class="modal-header">

            <div
                id="inventoryTitle"
                class="modal-title">

                Inventory

            </div>

            <button
                class="close-btn"
                type="button"
                onclick="closeInventory()">

                ×

            </button>

        </div>


        <div id="inventoryContent">

            <div class="loading">
                Memuat inventory...
            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     TOAST
     ========================================================= -->

<div
    id="toast"
    class="toast">
</div>


<script>


// ============================================================
// CONFIG
// ============================================================

const WORKER_URL =
    "https://adopt-me-bot-dashboard.badutlongor.workers.dev";


// ============================================================
// DASHBOARD TOKEN
// ============================================================
//
// Token ini harus sama dengan BOT_TOKEN Cloudflare.
// Untuk keamanan, sebaiknya nanti kita pindahkan autentikasi
// dashboard ke mekanisme session/auth khusus.
// ============================================================

const DASHBOARD_TOKEN =
    "0000";


// ============================================================
// STATE
// ============================================================

let bots = [];

let dashboardLoading =
    false;

let refreshRunning =
    false;


// ============================================================
// API URL
// ============================================================

function api(path) {

    return WORKER_URL + path;

}


// ============================================================
// FORMAT NUMBER
// ============================================================

function formatNumber(value) {

    return Number(
        value || 0
    ).toLocaleString(
        "id-ID"
    );

}


// ============================================================
// FORMAT DATE
// ============================================================

function formatDate(timestamp) {

    if (!timestamp) {

        return "-";

    }


    const date =
        new Date(
            timestamp
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "-";

    }


    return date.toLocaleString(
        "id-ID",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        }
    );

}


// ============================================================
// TOAST
// ============================================================

let toastTimer = null;


function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

}


// ============================================================
// LOAD DASHBOARD
// ============================================================

async function loadDashboard() {

    if (dashboardLoading) {

        return;

    }


    dashboardLoading =
        true;


    try {

        const response =
            await fetch(
                api(
                    "/api/dashboard/data?t="
                    + Date.now()
                ),
                {
                    method:
                        "GET",

                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP "
                + response.status
            );

        }


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "Gagal mengambil dashboard"
            );

        }


        bots =
            Array.isArray(
                data.bots
            )
                ? data.bots
                : [];


        updateStats(
            data.stats
        );


        renderBots();


    } catch (error) {

        console.error(
            "[DASHBOARD]",
            error
        );


        document.getElementById(
            "tableContainer"
        ).innerHTML = `

            <div class="empty">

                Gagal memuat dashboard.<br>

                <small>
                    ${escapeHtml(
                        error.message
                    )}
                </small>

            </div>

        `;

    } finally {

        dashboardLoading =
            false;

    }

}


// ============================================================
// UPDATE STATS
// ============================================================

function updateStats(stats) {

    stats =
        stats || {};


    document.getElementById(
        "statTotal"
    ).textContent =
        formatNumber(
            stats.total
        );


    document.getElementById(
        "statOnline"
    ).textContent =
        formatNumber(
            stats.online
        );


    document.getElementById(
        "statOffline"
    ).textContent =
        formatNumber(
            stats.offline
        );


    document.getElementById(
        "statCrystal"
    ).textContent =
        formatNumber(
            stats.totalCrystalEgg
        );


    document.getElementById(
        "statInventory"
    ).textContent =
        formatNumber(
            stats.totalInventory
        );

}


// ============================================================
// RENDER BOTS
// ============================================================

function renderBots() {

    const container =
        document.getElementById(
            "tableContainer"
        );


    if (!bots.length) {

        container.innerHTML = `

            <div class="empty">

                Belum ada bot yang mengirim telemetry.

            </div>

        `;

        return;

    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th>
                        RF
                    </th>

                    <th>
                        Username
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Bucks
                    </th>

                    <th>
                        Crystal Egg
                    </th>

                    <th>
                        Auto Trade
                    </th>

                    <th>
                        Last Heartbeat
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>

            <tbody>

    `;


    bots.forEach(
        (bot, index) => {


            const status =
                String(
                    bot.status ||
                    "OFFLINE"
                ).toUpperCase();


            const statusClass =
                status === "ONLINE"
                    ? "online"
                    : "offline";


            html += `

                <tr>

                    <td>
                        ${escapeHtml(
                            bot.rf_location || "-"
                        )}
                    </td>

                    <td>

                        <strong>
                            ${escapeHtml(
                                bot.username
                            )}
                        </strong>

                    </td>

                    <td>

                        <span
                            class="status ${statusClass}">

                            ●
                            ${status}

                        </span>

                    </td>

                    <td>
                        ${formatNumber(
                            bot.bucks
                        )}
                    </td>

                    <td>
                        ${formatNumber(
                            bot.crystalEggCount
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            bot.autotrade_status ||
                            "OFF"
                        )}
                    </td>

                    <td>
                        ${formatDate(
                            bot.lastHeartbeat
                        )}
                    </td>

                    <td>

                        <div class="actions">

                            <button
                                class="action-btn"
                                type="button"
                                title="Lihat Inventory"
                                onclick="openInventory(${index})">

                                📦

                            </button>

                        </div>

                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

    `;


    container.innerHTML =
        html;

}


// ============================================================
// REFRESH ALL
// ============================================================
//
// Ini SATU-SATUNYA tombol untuk meminta bot mengirim
// inventory terbaru.
//
// Tidak ada request ketika 📦 dibuka.
// ============================================================

async function refreshAll() {

    if (refreshRunning) {

        return;

    }


    refreshRunning =
        true;


    const button =
        document.getElementById(
            "refreshBtn"
        );


    const originalText =
        button.textContent;


    button.disabled =
        true;


    button.textContent =
        "⏳ Refreshing...";


    try {


        // ====================================================
        // 1. MINTA SEMUA BOT REFRESH INVENTORY
        // ====================================================

        const response =
            await fetch(
                api(
                    "/api/command/inventory/all"
                ),
                {
                    method:
                        "POST",

                    headers: {

                        "Authorization":
                            DASHBOARD_TOKEN,

                        "Content-Type":
                            "application/json"

                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok ||
            !data.success) {

            throw new Error(
                data.error ||
                "Gagal meminta refresh bot"
            );

        }


        showToast(
            "Refresh dikirim ke "
            + data.queued
            + " bot."
        );


        // ====================================================
        // 2. AMBIL DATA DASHBOARD TERBARU
        // ====================================================
        //
        // Ini mengambil data yang SUDAH ada di KV.
        //
        // Bot akan memperbaruinya setelah menerima command.
        // ====================================================

        await loadDashboard();


    } catch (error) {

        console.error(
            "[REFRESH]",
            error
        );


        showToast(
            "Refresh gagal: "
            + error.message
        );

    } finally {

        button.disabled =
            false;

        button.textContent =
            originalText;

        refreshRunning =
            false;

    }

}


// ============================================================
// OPEN INVENTORY
// ============================================================
//
// PENTING:
// Tidak ada fetch()
// Tidak ada API request.
// Tidak ada polling.
// Tidak ada loading dari server.
//
// Data langsung berasal dari `bots`.
// ============================================================

function openInventory(index) {

    const bot =
        bots[index];


    if (!bot) {

        return;

    }


    document.getElementById(
        "inventoryTitle"
    ).textContent =
        "📦 Inventory - "
        + bot.username;


    renderInventory(
        bot
    );


    document.getElementById(
        "inventoryModal"
    ).classList.add(
        "show"
    );

}


// ============================================================
// RENDER INVENTORY
// ============================================================

function renderInventory(bot) {

    const content =
        document.getElementById(
            "inventoryContent"
        );


    const grouped =
        Array.isArray(
            bot.groupedInventory
        )
            ? bot.groupedInventory
            : [];


    let html = `

        <div class="inventory-summary">

            <div class="inventory-stat">

                <div class="inventory-stat-label">
                    Total Item
                </div>

                <div class="inventory-stat-value">
                    ${formatNumber(
                        bot.inventoryCount
                    )}
                </div>

            </div>


            <div class="inventory-stat">

                <div class="inventory-stat-label">
                    Crystal Egg
                </div>

                <div class="inventory-stat-value">
                    ${formatNumber(
                        bot.crystalEggCount
                    )}
                </div>

            </div>


            <div class="inventory-stat">

                <div class="inventory-stat-label">
                    Bucks
                </div>

                <div class="inventory-stat-value">
                    ${formatNumber(
                        bot.bucks
                    )}
                </div>

            </div>

        </div>

    `;


    if (!grouped.length) {

        html += `

            <div class="empty">

                Inventory kosong atau belum pernah
                dikirim bot.

            </div>

        `;

    } else {


        grouped.forEach(
            group => {

                html += `

                    <div class="inventory-group">

                        <div class="inventory-group-title">

                            ${escapeHtml(
                                group.type ||
                                "Other"
                            )}

                        </div>

                        <div class="inventory-grid">

                `;


                const items =
                    Array.isArray(
                        group.items
                    )
                        ? group.items
                        : [];


                items.forEach(
                    item => {

                        html += `

                            <div
                                class="inventory-item">

                                <div
                                    class="inventory-item-name">

                                    ${escapeHtml(
                                        item.name ||
                                        "Unknown"
                                    )}

                                </div>

                                <div
                                    class="inventory-item-count">

                                    x${formatNumber(
                                        item.count
                                    )}

                                </div>

                            </div>

                        `;

                    }
                );


                html += `

                        </div>

                    </div>

                `;

            }
        );

    }


    html += `

        <div class="inventory-updated">

            Inventory terakhir:
            ${formatDate(
                bot.inventoryUpdatedAt
            )}

        </div>

    `;


    content.innerHTML =
        html;

}


// ============================================================
// CLOSE INVENTORY
// ============================================================

function closeInventory() {

    document.getElementById(
        "inventoryModal"
    ).classList.remove(
        "show"
    );

}


// ============================================================
// CLOSE OUTSIDE
// ============================================================

function closeInventoryOutside(event) {

    if (
        event.target.id ===
        "inventoryModal"
    ) {

        closeInventory();

    }

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}

loadDashboard();


setInterval(
    function() {

        loadDashboard();

    },
    60000
);


</script>
